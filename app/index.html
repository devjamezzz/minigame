<!doctype html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="theme-color" content="#2E7D5A" />
    <meta
      name="description"
      content="สิทธิพิเศษจาก CNY HEALTHCARE รับคูปองผ่าน LINE @clinicya และใช้งานตามเงื่อนไขที่กำหนด"
    />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="CNY Gacha" />
    <meta name="format-detection" content="telephone=no" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>สิทธิพิเศษจาก CNY HEALTHCARE | @clinicya</title>
    <script>
      ;(function () {
        var retryKey = 'cny-liff-first-load-retry'
        var retryParam = 'cny_liff_retry'
        var isLineClient = /\bLine\//i.test(navigator.userAgent)
        var url = new URL(window.location.href)
        var openedFromLiff = url.searchParams.has('liff.state')
        var alreadyRetried = url.searchParams.get(retryParam) === '1'

        if (openedFromLiff && !window.location.hash.startsWith('#/')) {
          var state = url.searchParams.get('liff.state') || ''
          try {
            state = decodeURIComponent(state)
          } catch (error) {
            // Some LINE WebViews already decode liff.state.
          }

          if (/^https?:\/\//i.test(state)) {
            var stateUrl = new URL(state)
            state = stateUrl.pathname + stateUrl.search + stateUrl.hash
          }

          var remainingParams = new URLSearchParams(url.search)
          remainingParams.delete('liff.state')
          remainingParams.delete('liff.referrer')
          remainingParams.delete(retryParam)

          var route = state.startsWith('#/')
            ? state
            : state.startsWith('/#/')
              ? state.slice(1)
              : state.startsWith('/')
                ? '#' + state
                : state.startsWith('?')
                  ? '#/' + state
                  : '#/'

          var search = remainingParams.toString()
          window.history.replaceState(
            null,
            '',
            url.pathname + (search ? '?' + search : '') + route
          )
        } else if (alreadyRetried) {
          url.searchParams.delete(retryParam)
          window.history.replaceState(
            null,
            '',
            url.pathname + (url.searchParams.toString() ? '?' + url.searchParams.toString() : '') + window.location.hash
          )
        }

        if (!isLineClient && !openedFromLiff) return

        var storage = {
          get: function () {
            try {
              return window.sessionStorage.getItem(retryKey)
            } catch (error) {
              return null
            }
          },
          set: function () {
            try {
              window.sessionStorage.setItem(retryKey, '1')
            } catch (error) {
              // Storage can be restricted in embedded browsers.
            }
          },
        }

        alreadyRetried = alreadyRetried || storage.get() === '1'

        var appMounted = function () {
          var root = document.getElementById('root')
          return Boolean(root && root.children.length && document.querySelector('.game-frame'))
        }

        var reloadOnceIfBlank = function () {
          var root = document.getElementById('root')
          if (appMounted() || alreadyRetried || document.readyState !== 'complete' || (root && root.children.length)) return
          alreadyRetried = true
          storage.set()
          var nextUrl = new URL(window.location.href)
          nextUrl.searchParams.set(retryParam, '1')
          window.location.replace(nextUrl.toString())
        }

        window.addEventListener('error', function () { window.setTimeout(reloadOnceIfBlank, 750) })
        window.addEventListener('unhandledrejection', function () { window.setTimeout(reloadOnceIfBlank, 750) })
        window.setTimeout(reloadOnceIfBlank, 8000)
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
